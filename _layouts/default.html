<!doctype html>
<html lang="{{ site.lang | default: 'pl' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="naglowek">
    <div class="kontener naglowek-wnetrze">
      <a class="logo" href="{{ '/' | relative_url }}">🔭 {{ site.title }}</a>
      <nav class="menu">
        <a href="{{ '/' | relative_url }}">Strona główna</a>
        <a href="{{ '/o-mnie/' | relative_url }}">O mnie</a>
      </nav>
    </div>
  </header>

  <div class="kontener uklad">
    <main class="tresc">
      {{ content }}
    </main>
    {% include sidebar.html %}
  </div>

  <footer class="stopka">
    <div class="kontener">
      &copy; {{ site.time | date: "%Y" }} {{ site.title }} ·
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </div>
  </footer>

  <script src="{{ '/assets/js/calendar.js' | relative_url }}" defer></script>
</body>
</html>
