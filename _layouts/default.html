<!doctype html>
<html lang="{{ site.lang | default: 'pl' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="naglowek">
    <div class="kontener naglowek-wnetrze">
      <a class="logo" href="{{ '/' | relative_url }}">
        <svg viewBox="0 0 32 32" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 20 L22 10"/><path d="M8 25 L25 15"/><path d="M5 20 L8 25"/><path d="M22 10 L25 15"/><path d="M16 21 L12 30"/><path d="M16 21 L20 30"/></g><circle cx="27" cy="6" r="2.2" fill="currentColor"/></svg>
        {{ site.title }}
      </a>
      <nav class="menu">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' or page.url contains '/strona/' or page.layout == 'post' %} class="aktywny"{% endif %}>Strona główna</a>
        <a href="{{ '/o-mnie/' | relative_url }}"{% if page.url == '/o-mnie/' %} class="aktywny"{% endif %}>O mnie</a>
      </nav>
    </div>
  </header>

  <div class="kontener uklad">
    <main class="tresc">
      {{ content }}
    </main>
    {% include sidebar.html %}
  </div>

  <footer class="stopka">
    <div class="kontener">
      &copy; {{ site.time | date: "%Y" }} {{ site.title }} ·
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </div>
  </footer>

  <script src="{{ '/assets/js/calendar.js' | relative_url }}" defer></script>
</body>
</html>
