<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5b8cff" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#3a5fd0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3a5fd0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dysk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6e0"/>
      <stop offset="18%" stop-color="#ffd27a"/>
      <stop offset="55%" stop-color="#f3b54a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f3b54a" stop-opacity="0"/>
    </radialGradient>
    <marker id="grot" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dfe4f5"/>
    </marker>
    <marker id="grotA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f3b54a"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="#0e1430"/>

  <!-- gwiazdki w tle -->
  <g fill="#ffffff" opacity="0.5">
    <circle cx="40" cy="120" r="1.2"/><circle cx="130" cy="660" r="1"/><circle cx="520" cy="110" r="1.3"/>
    <circle cx="470" cy="640" r="1"/><circle cx="90" cy="400" r="0.9"/><circle cx="560" cy="380" r="1"/>
    <circle cx="300" cy="95" r="0.9"/><circle cx="20" cy="560" r="1.1"/><circle cx="1180" cy="40" r="1"/>
  </g>

  <text x="600" y="52" text-anchor="middle" font-size="32" font-weight="700" fill="#f6d28f">Dlaczego naukowcy szukają ciemnej materii?</text>

  <!-- ===== LEWA CZĘŚĆ: galaktyka i halo ===== -->
  <text x="300" y="110" text-anchor="middle" font-size="22" font-weight="600" fill="#dfe4f5">1. Galaktyka i jej niewidzialne halo</text>

  <circle cx="300" cy="390" r="235" fill="url(#halo)"/>
  <circle cx="300" cy="390" r="235" fill="none" stroke="#7fa4ff" stroke-width="2" stroke-dasharray="8 8" opacity="0.8"/>

  <ellipse cx="300" cy="390" rx="130" ry="48" fill="url(#dysk)"/>
  <ellipse cx="300" cy="390" rx="22" ry="14" fill="#fff6e0"/>
  <!-- orbita gwiazdy -->
  <ellipse cx="300" cy="390" rx="105" ry="38" fill="none" stroke="#ffd27a" stroke-width="1.5" stroke-dasharray="3 5" opacity="0.8"/>
  <circle cx="405" cy="390" r="6" fill="#ffffff"/>
  <path d="M407,378 Q412,360 400,350" fill="none" stroke="#ffffff" stroke-width="2" marker-end="url(#grot)"/>

  <!-- etykiety -->
  <line x1="390" y1="420" x2="455" y2="500" stroke="#f3b54a" stroke-width="1.5"/>
  <text x="400" y="525" font-size="18" fill="#f3b54a">gwiazdy i gaz,</text>
  <text x="400" y="548" font-size="18" fill="#f3b54a">które widzimy</text>

  <line x1="175" y1="240" x2="130" y2="195" stroke="#9db8ff" stroke-width="1.5"/>
  <text x="40" y="160" font-size="18" fill="#9db8ff">halo ciemnej materii</text>
  <text x="40" y="183" font-size="16" fill="#9db8ff" opacity="0.85">(niewidzialne, dużo większe)</text>

  <text x="300" y="665" text-anchor="middle" font-size="17" fill="#8b95bb">Gwiazdy krążą wokół środka galaktyki,</text>
  <text x="300" y="688" text-anchor="middle" font-size="17" fill="#8b95bb">tak jak planety krążą wokół Słońca.</text>

  <!-- separator -->
  <line x1="600" y1="100" x2="600" y2="690" stroke="#232c52" stroke-width="2"/>

  <!-- ===== PRAWA CZĘŚĆ: wykres ===== -->
  <text x="900" y="110" text-anchor="middle" font-size="22" font-weight="600" fill="#dfe4f5">2. Jak szybko krążą gwiazdy?</text>

  <!-- osie: początek (690,560), x do 1150, y do 170 -->
  <line x1="690" y1="560" x2="1150" y2="560" stroke="#dfe4f5" stroke-width="2" marker-end="url(#grot)"/>
  <line x1="690" y1="560" x2="690" y2="165" stroke="#dfe4f5" stroke-width="2" marker-end="url(#grot)"/>
  <text x="920" y="598" text-anchor="middle" font-size="17" fill="#dfe4f5">odległość gwiazdy od środka galaktyki →</text>
  <text x="660" y="365" text-anchor="middle" font-size="17" fill="#dfe4f5" transform="rotate(-90 660 365)">prędkość gwiazdy →</text>

  <!-- obserwacje: krzywa płaska -->
  <path d="M690,560 C715,380 750,285 810,270 C870,258 1000,262 1130,258" fill="none" stroke="#f3b54a" stroke-width="5" stroke-linecap="round"/>
  <g fill="#f3b54a">
    <circle cx="830" cy="268" r="6"/><circle cx="900" cy="263" r="6"/>
    <circle cx="970" cy="262" r="6"/><circle cx="1040" cy="260" r="6"/><circle cx="1110" cy="258" r="6"/>
  </g>
  <text x="1135" y="235" text-anchor="end" font-size="18" font-weight="600" fill="#f3b54a">to, co naprawdę mierzymy</text>

  <!-- przewidywanie bez ciemnej materii -->
  <path d="M690,560 C715,380 745,300 790,295 C860,290 940,380 1130,445" fill="none" stroke="#9db8ff" stroke-width="4" stroke-dasharray="12 9" stroke-linecap="round"/>
  <text x="1135" y="478" text-anchor="end" font-size="18" fill="#9db8ff">gdyby była tylko</text>
  <text x="1135" y="500" text-anchor="end" font-size="18" fill="#9db8ff">widoczna materia</text>

  <!-- różnica -->
  <line x1="1010" y1="268" x2="1010" y2="395" stroke="#ffffff" stroke-width="2" marker-start="url(#grot)" marker-end="url(#grot)"/>
  <text x="1000" y="325" text-anchor="end" font-size="17" fill="#ffffff">tę różnicę</text>
  <text x="1000" y="347" text-anchor="end" font-size="17" fill="#ffffff">wyjaśnia</text>
  <text x="1000" y="369" text-anchor="end" font-size="17" fill="#ffffff">ciemna materia</text>

  <text x="900" y="665" text-anchor="middle" font-size="17" fill="#8b95bb">Dalekie gwiazdy krążą tak szybko, że bez dodatkowej</text>
  <text x="900" y="688" text-anchor="middle" font-size="17" fill="#8b95bb">niewidzialnej masy galaktyka rozleciałaby się.</text>
</svg>
