<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5b8cff" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#3a5fd0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3a5fd0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dysk" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6e0"/>
      <stop offset="18%" stop-color="#ffd27a"/>
      <stop offset="55%" stop-color="#f3b54a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f3b54a" stop-opacity="0"/>
    </radialGradient>
    <marker id="grot" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dfe4f5"/>
    </marker>
  </defs>

  <rect width="800" height="720" fill="#0e1430"/>

  <g fill="#ffffff" opacity="0.5">
    <circle cx="40" cy="120" r="1.2"/><circle cx="60" cy="610" r="1"/><circle cx="720" cy="110" r="1.3"/>
    <circle cx="670" cy="640" r="1"/><circle cx="60" cy="420" r="0.9"/><circle cx="760" cy="380" r="1"/>
    <circle cx="300" cy="95" r="0.9"/><circle cx="20" cy="560" r="1.1"/><circle cx="560" cy="80" r="1"/>
  </g>

  <text x="400" y="56" text-anchor="middle" font-size="32" font-weight="700" fill="#f6d28f">Galaktyka i jej niewidzialne halo</text>

  <circle cx="400" cy="380" r="235" fill="url(#halo)"/>
  <circle cx="400" cy="380" r="235" fill="none" stroke="#7fa4ff" stroke-width="2" stroke-dasharray="8 8" opacity="0.8"/>

  <ellipse cx="400" cy="380" rx="130" ry="48" fill="url(#dysk)"/>
  <ellipse cx="400" cy="380" rx="22" ry="14" fill="#fff6e0"/>
  <ellipse cx="400" cy="380" rx="105" ry="38" fill="none" stroke="#ffd27a" stroke-width="1.5" stroke-dasharray="3 5" opacity="0.8"/>
  <circle cx="505" cy="380" r="6" fill="#ffffff"/>
  <path d="M507,368 Q512,350 500,340" fill="none" stroke="#ffffff" stroke-width="2" marker-end="url(#grot)"/>

  <line x1="490" y1="410" x2="555" y2="490" stroke="#f3b54a" stroke-width="1.5"/>
  <text x="500" y="515" font-size="19" fill="#f3b54a">gwiazdy i gaz,</text>
  <text x="500" y="539" font-size="19" fill="#f3b54a">które widzimy</text>

  <line x1="290" y1="245" x2="255" y2="205" stroke="#9db8ff" stroke-width="1.5"/>
  <text x="40" y="150" font-size="19" fill="#9db8ff">halo ciemnej materii</text>
  <text x="40" y="174" font-size="17" fill="#9db8ff" opacity="0.85">(niewidzialne, dużo większe)</text>

  <text x="400" y="660" text-anchor="middle" font-size="18" fill="#8b95bb">Gwiazdy krążą wokół środka galaktyki, tak jak planety wokół Słońca.</text>
  <text x="400" y="686" text-anchor="middle" font-size="18" fill="#8b95bb">Grawitacja halo pomaga utrzymać je na swoich miejscach.</text>
</svg>
