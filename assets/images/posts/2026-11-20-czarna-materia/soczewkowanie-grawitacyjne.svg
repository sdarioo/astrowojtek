<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5b8cff" stop-opacity="0.55"/>
      <stop offset="65%" stop-color="#3a5fd0" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3a5fd0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6e0"/>
      <stop offset="45%" stop-color="#ffd27a"/>
      <stop offset="100%" stop-color="#f3b54a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="zrodlo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#d9b3ff"/>
      <stop offset="100%" stop-color="#b37bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ziemia" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#8fd3ff"/>
      <stop offset="100%" stop-color="#1f5fbf"/>
    </radialGradient>
    <marker id="grot" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e2c8ff"/>
    </marker>
    <clipPath id="okno"><circle cx="1045" cy="600" r="88"/></clipPath>
  </defs>

  <rect width="1200" height="720" fill="#0e1430"/>
  <g fill="#ffffff" opacity="0.5">
    <circle cx="60" cy="560" r="1.1"/><circle cx="380" cy="120" r="1"/><circle cx="820" cy="130" r="1.2"/>
    <circle cx="760" cy="520" r="1"/><circle cx="1150" cy="200" r="1"/><circle cx="430" cy="500" r="0.9"/>
    <circle cx="20" cy="90" r="1"/><circle cx="980" cy="80" r="1"/>
  </g>

  <text x="600" y="52" text-anchor="middle" font-size="32" font-weight="700" fill="#f6d28f">Soczewkowanie grawitacyjne: jak „zobaczyć” niewidzialne?</text>

  <!-- gromada galaktyk + halo ciemnej materii -->
  <circle cx="580" cy="310" r="140" fill="url(#halo)"/>
  <circle cx="580" cy="310" r="140" fill="none" stroke="#7fa4ff" stroke-width="2" stroke-dasharray="8 8" opacity="0.8"/>
  <g>
    <ellipse cx="580" cy="310" rx="26" ry="18" fill="url(#gal)"/>
    <ellipse cx="545" cy="290" rx="14" ry="9" fill="url(#gal)"/>
    <ellipse cx="615" cy="330" rx="15" ry="10" fill="url(#gal)"/>
    <ellipse cx="555" cy="340" rx="10" ry="7" fill="url(#gal)"/>
    <ellipse cx="610" cy="285" rx="10" ry="7" fill="url(#gal)"/>
    <ellipse cx="520" cy="320" rx="8" ry="6" fill="url(#gal)"/>
    <ellipse cx="640" cy="305" rx="8" ry="6" fill="url(#gal)"/>
  </g>
  <text x="580" y="478" text-anchor="middle" font-size="19" font-weight="600" fill="#9db8ff">gromada galaktyk</text>
  <text x="580" y="501" text-anchor="middle" font-size="19" font-weight="600" fill="#9db8ff">+ ciemna materia</text>

  <!-- źródło: odległa galaktyka -->
  <ellipse cx="110" cy="310" rx="24" ry="15" fill="url(#zrodlo)"/>
  <text x="110" y="355" text-anchor="middle" font-size="18" fill="#e2c8ff">bardzo odległa</text>
  <text x="110" y="377" text-anchor="middle" font-size="18" fill="#e2c8ff">galaktyka</text>

  <!-- Ziemia -->
  <circle cx="1080" cy="310" r="24" fill="url(#ziemia)"/>
  <text x="1080" y="362" text-anchor="middle" font-size="18" fill="#dfe4f5">Ziemia</text>
  <text x="1080" y="384" text-anchor="middle" font-size="16" fill="#8b95bb">(nasz teleskop)</text>

  <!-- prawdziwa droga światła: zakrzywiona -->
  <path d="M130,302 Q580,190 1052,302" fill="none" stroke="#e2c8ff" stroke-width="3.5" marker-end="url(#grot)"/>
  <path d="M130,318 Q580,430 1052,318" fill="none" stroke="#e2c8ff" stroke-width="3.5" marker-end="url(#grot)"/>
  <text x="330" y="222" text-anchor="middle" font-size="17" fill="#e2c8ff">światło skręca</text>
  <text x="330" y="243" text-anchor="middle" font-size="17" fill="#e2c8ff">przy dużej masie</text>

  <!-- pozorny kierunek: przedłużenie linii z Ziemi -->
  <line x1="1052" y1="302" x2="215" y2="100" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="7 7" opacity="0.6"/>
  <line x1="1052" y1="318" x2="215" y2="520" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="7 7" opacity="0.6"/>
  <path d="M188,84 Q212,98 236,96" fill="none" stroke="#d9b3ff" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
  <path d="M188,536 Q212,522 236,524" fill="none" stroke="#d9b3ff" stroke-width="7" stroke-linecap="round" opacity="0.85"/>
  <text x="255" y="84" font-size="17" fill="#ffffff">tu wydaje się nam, że jest galaktyka</text>
  <text x="255" y="550" font-size="17" fill="#ffffff">i tu też!</text>

  <!-- okienko: widok w teleskopie -->
  <circle cx="1045" cy="600" r="88" fill="#070b1c"/>
  <g clip-path="url(#okno)">
    <circle cx="1045" cy="600" r="70" fill="url(#halo)"/>
    <ellipse cx="1045" cy="600" rx="13" ry="9" fill="url(#gal)"/>
    <ellipse cx="1028" cy="590" rx="7" ry="5" fill="url(#gal)"/>
    <ellipse cx="1062" cy="610" rx="7" ry="5" fill="url(#gal)"/>
    <path d="M1003,560 A58,58 0 0 1 1087,560" fill="none" stroke="#d9b3ff" stroke-width="6" stroke-linecap="round"/>
    <path d="M1000,645 A58,58 0 0 0 1078,652" fill="none" stroke="#d9b3ff" stroke-width="5" stroke-linecap="round"/>
  </g>
  <circle cx="1045" cy="600" r="88" fill="none" stroke="#dfe4f5" stroke-width="2"/>
  <text x="930" y="580" text-anchor="end" font-size="17" fill="#dfe4f5">Widok w teleskopie:</text>
  <text x="930" y="602" text-anchor="end" font-size="17" fill="#dfe4f5">jedna galaktyka</text>
  <text x="930" y="624" text-anchor="end" font-size="17" fill="#dfe4f5">widoczna jako łuki</text>

  <!-- wyjaśnienie -->
  <text x="40" y="620" font-size="18" fill="#8b95bb">Masa działa jak szkło powiększające i zakrzywia światło.</text>
  <text x="40" y="645" font-size="18" fill="#8b95bb">Skręca mocniej, niż mogłaby to zrobić sama widoczna gromada.</text>
  <text x="40" y="670" font-size="18" fill="#8b95bb">Dzięki temu naukowcy mogą „zważyć” ciemną materię.</text>
</svg>
