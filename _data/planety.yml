# ============================================================
#  Dane do strony „Układ Słoneczny” (/uklad-sloneczny/)
#  Źródło: NASA Planetary Fact Sheet (nssdc.gsfc.nasa.gov/planetary/factsheet)
#
#  id        – angielska nazwa ciała (potrzebna do obliczeń, NIE ZMIENIAĆ)
#  obraz     – plik w assets/images/uklad-sloneczny/
#  rozmiar   – wielkość obrazka na mapie (umowna, nie w skali)
#  okres_dni – ile dni trwa jeden obieg Słońca (do rysowania orbity)
#  dane      – wiersze w okienku z informacjami: [opis, wartość]
#              (możesz dopisywać nowe wiersze)
# ============================================================

- id: Sun
  nazwa: Słońce
  rodzaj: gwiazda
  obraz: slonce.png
  rozmiar: 66
  dane:
    - ["Średnica", "1 392 700 km (109 razy więcej niż Ziemia)"]
    - ["Obrót wokół osi", "ok. 25 dni na równiku, ok. 35 dni przy biegunach"]
    - ["Temperatura powierzchni", "ok. 5500 °C"]
    - ["Temperatura w środku", "ok. 15 milionów °C"]
    - ["Wiek", "ok. 4,6 miliarda lat"]
  ciekawostka: "Słońce zawiera 99,8% masy całego Układu Słonecznego. Światło ze Słońca leci do Ziemi około 8 minut i 20 sekund."

