# ============================================================
#  Pytania do strony „Quiz wiedzy o kosmosie” (/quiz/)
#
#  W jednym teście losuje się 15 pytań z tej listy.
#
#  pytanie      – treść pytania
#  odpowiedzi   – dokładnie 3 odpowiedzi.
#                 PIERWSZA odpowiedź jest zawsze POPRAWNA –
#                 na stronie kolejność odpowiedzi jest losowana.
#  wyjasnienie  – krótka ciekawostka pokazywana po odpowiedzi
#  link         – (opcjonalnie) strona, na której można o tym poczytać
