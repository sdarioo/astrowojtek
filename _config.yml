# ============================================================
#  Ustawienia bloga AstroWojtek
#  Po zmianie tego pliku GitHub sam przebuduje stronę (ok. 1-2 min).
# ============================================================

title: AstroWojtek
description: Blog o gwiazdach, planetach i nocnym niebie.
lang: pl
author:
  name: Wojtek
  # Krótki opis widoczny w menu bocznym
  bio: Młody astronom amator. Obserwuję niebo i piszę o tym, co zobaczę.

# Adres strony: https://astrowojtek.pl/
url: https://astrowojtek.pl
baseurl: ""

# Adresy artykułów, np. /2026/11/pierwsza-obserwacja/
permalink: /:year/:month/:title/

# Ile artykułów na jednej stronie listy
paginate: 6
paginate_path: /strona/:num/

timezone: Europe/Warsaw
markdown: kramdown

plugins:
  - jekyll-paginate
  - jekyll-feed
  - jekyll-seo-tag

# ------------------------------------------------------------
#  Komentarze i polubienia pod artykułami
#  provider: "" (wyłączone), "astrowojtek" (własny serwis), "disqus"
#  albo "htmlcommentbox".
#  api_url: adres serwisu komentarzy (bez "/" na końcu). Dopóki jest pusty,
#  komentarze się nie wyświetlają.
#  turnstile_sitekey: klucz Cloudflare Turnstile (pusty = bez captchy).
#  Komentarze pod jednym artykułem wyłączysz, dopisując w nagłówku
#  artykułu: komentarze: false
#  Instrukcja: GITHUB_PAGES_SETUP.md, sekcja "Komentarze".
#  Wymagania serwisu: SERWIS-KOMENTARZY-WYMAGANIA.md
# ------------------------------------------------------------
comments:
  provider: "astrowojtek"
  api_url: "https://civil-comments.fly.dev"
  turnstile_sitekey: ""
  disqus_shortname: ""

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
    values:
      layout: page

exclude:
  - README.md
  - GITHUB_PAGES_SETUP.md
  - JAK-DODAC-ARTYKUL.md
  - SERWIS-KOMENTARZY-WYMAGANIA.md
  - dodaj-artykul.ps1
  - szablon-artykulu/
  - Gemfile
  - Gemfile.lock
  - vendor/
